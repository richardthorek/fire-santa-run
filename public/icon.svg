<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Flame gradient: Summer Gold to a lighter gold highlight -->
    <linearGradient id="flameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#F6A609;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD166;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Signal Red rounded-square tile (rx ~22%, squircle family) -->
  <rect width="512" height="512" rx="113" ry="113" fill="#D8232A"/>

  <!-- Flame mark, centred within the middle 80% for maskable safety -->
  <path d="M256 392
           C205 392 168 353 168 308
           C168 274 190 250 190 250
           C190 278 208 292 208 292
           C199 260 208 228 233 206
           C229 228 242 242 242 242
           C242 214 254 186 256 168
           C258 186 270 214 270 242
           C270 242 283 228 279 206
           C304 228 313 260 304 292
           C304 292 322 278 322 250
           C322 250 344 274 344 308
           C344 353 307 392 256 392 Z"
        fill="url(#flameGrad)" />

  <!-- Integrated Santa hat, seated on top of the flame -->
  <ellipse cx="256" cy="172" rx="46" ry="14" fill="#FFFFFF"/>
  <path d="M212 172 L256 92 L300 172 Z" fill="#E0555A"/>
  <circle cx="256" cy="88" r="16" fill="#FFFFFF"/>
</svg>
