<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Santa Run – Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #FAFAFA 0%, #FFF9C4 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #212121;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 400px;
      }
      .emoji {
        font-size: 72px;
        display: block;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        color: #D32F2F;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 1rem;
        color: #616161;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      .retry-btn {
        display: inline-block;
        padding: 0.75rem 2rem;
        background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .retry-btn:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="emoji">🎅</span>
      <h1>Santa is Offline!</h1>
      <p>
        It looks like you're not connected to the internet.
        Check your connection and try again — Santa's route will be waiting!
      </p>
      <button class="retry-btn" onclick="window.location.reload()">
        Try Again
      </button>
    </div>
  </body>
</html>
