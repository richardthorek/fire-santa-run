<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Performance optimizations: DNS prefetch and preconnect for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Santa Run" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- iOS Splash Screens -->
    <!-- iPhone SE -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-iphone-640x1136.png" />
    <!-- iPhone 8 -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-iphone-750x1334.png" />
    <!-- iPhone 8 Plus -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-iphone-1242x2208.png" />
    <!-- iPhone X/XS/11 Pro -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-iphone-1125x2436.png" />
    <!-- iPhone XR/11 -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-iphone-828x1792.png" />
    <!-- iPhone 12/13/14 -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-iphone-1170x2532.png" />
    <!-- iPhone 14 Pro -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-iphone-1179x2556.png" />
    <!-- iPhone 14 Plus / 15 Plus -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/splash-iphone-1290x2796.png" />
    <!-- iPad (9.7") -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-ipad-1536x2048.png" />
    <!-- iPad Air / iPad Pro 11" -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-ipad-1668x2388.png" />
    <!-- iPad Pro 12.9" -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-ipad-2048x2732.png" />
    
    <!-- Default Meta Tags (will be overridden by React Helmet) -->
    <meta name="description" content="Track Santa in real-time as your local Rural Fire Service brings Christmas joy to your community. Plan routes, share tracking links, and spread holiday cheer!" />
    <meta name="theme-color" content="#D32F2F" />
    
    <!-- Default Open Graph Tags -->
    <meta property="og:site_name" content="Fire Santa Run" />
    <meta property="og:type" content="website" />
    
    <title>Fire Santa Run</title>
    
    <!-- Critical CSS for initial render - inlined for performance -->
    <style>
      /* Reset and base styles */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #FAFAFA;
        color: #212121;
      }
      /* Loading screen styles */
      #msal-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #FAFAFA;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #msal-loading > div {
        text-align: center;
      }
      #msal-loading .emoji {
        font-size: 64px;
        margin-bottom: 1rem;
      }
      #msal-loading p {
        font-size: 1.125rem;
        color: #424242;
      }
    </style>
    
    <!-- Google Fonts - Load asynchronously to avoid render blocking -->
    <!-- Using media="print" initially, then switch to "all" once loaded via JavaScript -->
    <!-- Fallback: System fonts if JavaScript disabled -->
    <link 
      id="google-fonts-link"
      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap"
      media="print"
    >
    <noscript>
      <link 
        rel="stylesheet" 
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap"
      >
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Loading screen shown while MSAL initializes (removed when React mounts) -->
    <div id="msal-loading">
      <div>
        <div class="emoji">🎅</div>
        <p>Loading Fire Santa Run...</p>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
