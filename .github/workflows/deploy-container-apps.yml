name: Deploy to Azure Container Apps

# Builds a single container image (React SPA + Hono API server) and deploys
# it to Azure Container Apps.
#
# Architecture:
#   - The image is built from the root Dockerfile (multi-stage: client build,
#     server build, minimal runtime).
#   - Realtime tracking runs in-process inside this same container (see
#     server/src/realtime/) — there is no separate realtime service to deploy.
#   - Pushed to GitHub Container Registry (ghcr.io), then the Container App
#     revision is updated to that image tag.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions, in the
# 'copilot' environment):
#   - AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#       OIDC federated credentials for `azure/login` — no stored Azure secret.
#       See infra/README.md for the one-time Entra app registration setup.
#   - VITE_MAPBOX_TOKEN                  : Mapbox API token (baked into the SPA at build time)
#
# Optional GitHub secrets:
#   - VITE_ENTRA_CLIENT_ID / VITE_ENTRA_TENANT_ID / VITE_ENTRA_AUTHORITY / VITE_ENTRA_REDIRECT_URI
#   - GHCR_PULL_TOKEN : classic PAT with read:packages, only needed if the
#       ghcr.io package is private (see infra/README.md — making the package
#       public avoids needing this entirely).
#
# Required GitHub variables (same environment):
#   - AZURE_CONTAINER_APP_NAME : Container App name (from `infra/deploy.sh` output)
#   - AZURE_RESOURCE_GROUP     : Resource group containing it
#
# Runtime environment variables (Storage, Stripe, VAPID, etc.) are seeded onto
# the Container App by infra/seed-secrets.sh, not by this workflow — deploying
# a new image never touches them.
#
# See infra/README.md for full setup instructions.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

jobs:
  quality_checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Quality Checks (Lint, Test)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage
        env:
          VITE_DEV_MODE: 'true'
          VITE_MAPBOX_TOKEN: 'test-token'

  e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: E2E Tests (Playwright)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          VITE_DEV_MODE: 'true'
          VITE_MAPBOX_TOKEN: 'pk.e2e-dummy-token'
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build_and_deploy:
    needs: [quality_checks, e2e]
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    name: Build and Deploy to Container Apps
    environment: copilot
    # Prevent concurrent deployments to the same Container App, which cause
    # 409 Conflict errors from overlapping revision updates. New deployments
    # queue rather than cancel in-progress ones so every commit is deployed
    # in order.
    concurrency:
      group: deploy-container-apps-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      HAS_AZURE_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
      HAS_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME != '' }}
      HAS_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP != '' }}
    permissions:
      contents: read
      pull-requests: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds both the React SPA (Vite, VITE_* baked in as build args) and
      # the Hono server in one multi-stage image — see /Dockerfile.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}
            VITE_ENTRA_CLIENT_ID=${{ secrets.VITE_ENTRA_CLIENT_ID }}
            VITE_ENTRA_TENANT_ID=${{ secrets.VITE_ENTRA_TENANT_ID }}
            VITE_ENTRA_AUTHORITY=${{ secrets.VITE_ENTRA_AUTHORITY }}
            VITE_ENTRA_REDIRECT_URI=${{ secrets.VITE_ENTRA_REDIRECT_URI }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        if: env.HAS_AZURE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Container Apps
        if: env.HAS_AZURE_OIDC == 'true' && env.HAS_APP_NAME == 'true' && env.HAS_RESOURCE_GROUP == 'true'
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Seed Container App environment variables
        if: env.HAS_AZURE_OIDC == 'true' && env.HAS_APP_NAME == 'true' && env.HAS_RESOURCE_GROUP == 'true'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          SITE_ADMIN_USER_IDS: ${{ secrets.SITE_ADMIN_USER_IDS }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          REALTIME_WS_SECRET: ${{ secrets.REALTIME_WS_SECRET }}
        run: |
          # Detect environment from resource group name (dev or prod)
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          ENV=$(echo "$RG" | grep -oE 'dev|prod' | head -1)
          SUFFIX=$(echo "$RG" | sed 's/.*-\([a-z0-9]*\)$/\1/')

          echo "Seeding secrets to Container App ($ENV environment, suffix: $SUFFIX)..."
          ./infra/seed-secrets.sh --env "$ENV" --suffix "$SUFFIX"

      - name: Fail if deployment config is missing
        if: env.HAS_AZURE_OIDC != 'true' || env.HAS_APP_NAME != 'true' || env.HAS_RESOURCE_GROUP != 'true'
        run: |
          echo "::error::Deployment configuration is incomplete. The following must be set in the 'copilot' GitHub environment:"
          echo "  - Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC federated credentials)"
          echo "  - Variables: AZURE_CONTAINER_APP_NAME, AZURE_RESOURCE_GROUP"
          echo "See infra/README.md for setup instructions."
          exit 1
