name: CI/CD Pipeline

# Unified CI/CD Pipeline — Single workflow handles all checks and deployment.
#
# Every push/PR runs: change detection → lint → type-check → unit tests → E2E.
# Push to main ALSO runs: OIDC validation → deploy IaC (if changed) → build/push
# image (if code changed) → seed secrets → deploy.
#
# Security: CodeQL scanning runs via GitHub's default setup (enabled in repo settings).
#
# No workflow duplication. No redundant logins. Conditional execution to skip
# unnecessary work (e.g., don't rebuild image if only IaC changed).
#
# Architecture:
#   - The image is built from the root Dockerfile (multi-stage: client build,
#     server build, minimal runtime).
#   - Realtime tracking runs in-process inside this same container (see
#     server/src/realtime/) — there is no separate realtime service to deploy.
#   - Pushed to GitHub Container Registry (ghcr.io), then the Container App
#     revision is updated to that image tag.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions, in the
# 'copilot' environment):
#   - AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#       OIDC federated credentials for `azure/login` — no stored Azure secret.
#       See infra/README.md for the one-time Entra app registration setup.
#   - VITE_MAPBOX_TOKEN                  : Mapbox API token (baked into the SPA at build time)
#
# Optional GitHub secrets:
#   - VITE_ENTRA_CLIENT_ID / VITE_ENTRA_TENANT_ID / VITE_ENTRA_AUTHORITY / VITE_ENTRA_REDIRECT_URI
#   - STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / STRIPE_PRICE_ID / SITE_ADMIN_USER_IDS
#   - VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT / REALTIME_WS_SECRET
#   - GHCR_PULL_TOKEN : classic PAT with read:packages (only if private package)
#
# Required GitHub variables (same environment):
#   - AZURE_CONTAINER_APP_NAME : Container App name
#   - AZURE_RESOURCE_GROUP     : Resource group containing it
#   - AZURE_ENVIRONMENT        : dev or prod (inferred from resource group if not set)
#
# See infra/README.md for full setup instructions.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # DETECT CHANGES: determine what files changed to skip unnecessary steps
  # ─────────────────────────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    name: Detect Changes
    outputs:
      iac-changed: ${{ steps.detect.outputs.iac-changed }}
      code-changed: ${{ steps.detect.outputs.code-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        run: |
          # On pull requests, compare against the merge base; on pushes, compare against the previous commit
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # Default to assuming changes if we can't compute diff (first push, etc.)
          if [[ -z "$BASE" ]] || [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "iac-changed=true" >> $GITHUB_OUTPUT
            echo "code-changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Detect IaC changes (Bicep, deploy scripts, parameters)
          if git diff --name-only "$BASE"..HEAD | grep -qE '(infra/|Dockerfile)'; then
            echo "iac-changed=true" >> $GITHUB_OUTPUT
          else
            echo "iac-changed=false" >> $GITHUB_OUTPUT
          fi

          # Detect code changes (everything except CI config and docs)
          if git diff --name-only "$BASE"..HEAD | grep -qvE '(^\.github/|\.md$|\.github/|LICENSE)'; then
            echo "code-changed=true" >> $GITHUB_OUTPUT
          else
            echo "code-changed=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # QUALITY: lint and unit tests (always run on PR/push)
  # ─────────────────────────────────────────────────────────────────────────
  quality_checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Quality Checks (Lint, Test)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npm run test:coverage
        env:
          VITE_DEV_MODE: 'true'
          VITE_MAPBOX_TOKEN: 'test-token'

  # ─────────────────────────────────────────────────────────────────────────
  # E2E: Playwright tests (always run on PR/push)
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: E2E Tests (Playwright)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          VITE_DEV_MODE: 'true'
          VITE_MAPBOX_TOKEN: 'pk.e2e-dummy-token'
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # DEPLOY: infrastructure + image + secrets (only on push to main or manual)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [quality_checks, e2e, detect-changes]
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    name: Deploy to Azure Container Apps
    environment: copilot
    concurrency:
      group: deploy-container-apps-${{ github.ref }}
      cancel-in-progress: false
    env:
      HAS_AZURE_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
      HAS_APP_CONFIG: ${{ vars.AZURE_CONTAINER_APP_NAME != '' && vars.AZURE_RESOURCE_GROUP != '' }}
      IAC_CHANGED: ${{ needs.detect-changes.outputs.iac-changed }}
      CODE_CHANGED: ${{ needs.detect-changes.outputs.code-changed }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # ── Step 1: Validate Azure OIDC credentials (fail fast) ──────────────
      - name: Validate Azure configuration
        if: env.HAS_AZURE_OIDC != 'true' || env.HAS_APP_CONFIG != 'true'
        run: |
          echo "::error::Deployment configuration is incomplete."
          echo "Missing in 'copilot' GitHub environment:"
          [[ "${{ secrets.AZURE_CLIENT_ID }}" == "" ]] && echo "  - Secret: AZURE_CLIENT_ID"
          [[ "${{ secrets.AZURE_TENANT_ID }}" == "" ]] && echo "  - Secret: AZURE_TENANT_ID"
          [[ "${{ secrets.AZURE_SUBSCRIPTION_ID }}" == "" ]] && echo "  - Secret: AZURE_SUBSCRIPTION_ID"
          [[ "${{ vars.AZURE_CONTAINER_APP_NAME }}" == "" ]] && echo "  - Variable: AZURE_CONTAINER_APP_NAME"
          [[ "${{ vars.AZURE_RESOURCE_GROUP }}" == "" ]] && echo "  - Variable: AZURE_RESOURCE_GROUP"
          echo "See infra/README.md for setup instructions."
          exit 1

      # ── Step 2: Single Azure login (reused for all Azure operations) ────
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Step 3: Deploy infrastructure (only if Bicep/Dockerfile changed) ─
      - name: Deploy infrastructure (Bicep)
        if: env.IAC_CHANGED == 'true'
        run: |
          echo "🚀 Infrastructure changes detected. Deploying Bicep template..."

          # Extract environment and suffix from resource group name
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          ENV=$(echo "$RG" | grep -oE 'dev|prod' | head -1)
          SUFFIX=$(echo "$RG" | sed 's/.*-\([a-z0-9]*\)$/\1/')

          ./infra/deploy.sh --env "$ENV" --suffix "$SUFFIX"

          echo "✅ Infrastructure deployment complete."

      - name: Skip infrastructure deployment
        if: env.IAC_CHANGED != 'true'
        run: echo "⏭️  No infrastructure changes detected. Skipping Bicep deployment."

      # ── Step 4: Build and push Docker image ─────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: env.CODE_CHANGED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}
            VITE_ENTRA_CLIENT_ID=${{ secrets.VITE_ENTRA_CLIENT_ID }}
            VITE_ENTRA_TENANT_ID=${{ secrets.VITE_ENTRA_TENANT_ID }}
            VITE_ENTRA_AUTHORITY=${{ secrets.VITE_ENTRA_AUTHORITY }}
            VITE_ENTRA_REDIRECT_URI=${{ secrets.VITE_ENTRA_REDIRECT_URI }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip image build (no code changes)
        if: env.CODE_CHANGED != 'true'
        run: echo "⏭️  No code changes detected. Skipping Docker build and image deployment."

      # ── Step 5: Update Container App image revision ──────────────────────
      - name: Deploy image to Container Apps
        if: env.CODE_CHANGED == 'true'
        run: |
          echo "📦 Deploying image to Container Apps..."
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "✅ Image deployed."

      # ── Step 6: Seed secrets to Container App ────────────────────────────
      - name: Seed Container App environment variables
        if: env.IAC_CHANGED == 'true' || env.CODE_CHANGED == 'true'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          SITE_ADMIN_USER_IDS: ${{ secrets.SITE_ADMIN_USER_IDS }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          REALTIME_WS_SECRET: ${{ secrets.REALTIME_WS_SECRET }}
        run: |
          echo "🔐 Seeding secrets to Container App..."

          # Extract environment and suffix from resource group name
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          ENV=$(echo "$RG" | grep -oE 'dev|prod' | head -1)
          SUFFIX=$(echo "$RG" | sed 's/.*-\([a-z0-9]*\)$/\1/')

          ./infra/seed-secrets.sh --env "$ENV" --suffix "$SUFFIX"

          echo "✅ Secrets seeded."

      # ── Step 7: Summary ──────────────────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          echo "📊 Deployment Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Infrastructure changed: ${{ env.IAC_CHANGED }}"
          echo "Code changed:           ${{ env.CODE_CHANGED }}"
          echo "Azure config valid:     ${{ env.HAS_AZURE_OIDC }}"
          echo ""
          echo "Deployed to:"
          echo "  App:     ${{ vars.AZURE_CONTAINER_APP_NAME }}"
          echo "  RG:      ${{ vars.AZURE_RESOURCE_GROUP }}"
          [[ "${{ env.IAC_CHANGED }}" == "true" ]] && echo "  Status:  ✅ Infrastructure + Image deployed"
          [[ "${{ env.IAC_CHANGED }}" != "true" && "${{ env.CODE_CHANGED }}" == "true" ]] && echo "  Status:  ✅ Image deployed"
          [[ "${{ env.CODE_CHANGED }}" != "true" ]] && echo "  Status:  ⏭️  No changes to deploy"
          echo ""
          echo "Monitor: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
