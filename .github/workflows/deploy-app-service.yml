name: Deploy to Azure App Service

# Builds and deploys the Fire Santa Run application to Azure App Service.
#
# Architecture:
#   - Frontend: Vite React SPA, built to dist/
#   - Backend:  Hono Node.js server (server/), served from App Service
#   - The Hono server serves both /api/* and the static SPA
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   - AZURE_APP_SERVICE_PUBLISH_PROFILE  : App Service publish profile XML
#                                          (from `az deployment sub show` → appServicePublishProfile output)
#   - VITE_MAPBOX_TOKEN                  : Mapbox API token
#
# Optional GitHub Secrets:
#   - VITE_ENTRA_CLIENT_ID / VITE_ENTRA_TENANT_ID / VITE_ENTRA_AUTHORITY
#   - VITE_ENTRA_REDIRECT_URI
#
# App Service environment variables (set via Azure Portal or `az webapp config appsettings set`):
#   - AZURE_STORAGE_CONNECTION_STRING
#   - AZURE_WEBPUBSUB_CONNECTION_STRING
#   - AZURE_WEBPUBSUB_HUB_NAME
#   - PORT (default 8080)
#   - DEV_MODE (false in production)
#
# See infra/README.md for full setup instructions.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

jobs:
  quality_checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Quality Checks (Lint, Test)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage
        env:
          VITE_DEV_MODE: 'true'
          VITE_MAPBOX_TOKEN: 'test-token'

  e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: E2E Tests (Playwright)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          VITE_DEV_MODE: 'true'
          VITE_MAPBOX_TOKEN: 'test-token'
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build_and_deploy:
    needs: [quality_checks, e2e]
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    name: Build and Deploy to App Service
    environment: copilot
    # Prevent concurrent deployments to the same App Service, which cause 409 Conflict
    # errors from Azure's OneDeploy. New deployments queue rather than cancel in-progress
    # ones to ensure every commit is deployed in order.
    concurrency:
      group: deploy-app-service-${{ github.ref }}
      cancel-in-progress: false
    env:
      HAS_PUBLISH_PROFILE: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE != '' }}
      HAS_APP_SERVICE_NAME: ${{ vars.AZURE_APP_SERVICE_NAME != '' }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      # ── Build React frontend ──────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Build React SPA
        run: npm run build
        env:
          VITE_DEV_MODE: 'false'
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_APP_NAME: 'Fire Santa Run'
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_AUTHORITY: ${{ secrets.VITE_ENTRA_AUTHORITY }}
          VITE_ENTRA_REDIRECT_URI: ${{ secrets.VITE_ENTRA_REDIRECT_URI }}

      # ── Build Hono server ─────────────────────────────────────────────────
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Build Hono server
        run: npm run build
        working-directory: server

      # ── Assemble deployment package ───────────────────────────────────────
      # Structure deployed to App Service:
      #   /dist/          ← React SPA (served as static files)
      #   /server/        ← Hono server
      #     dist/         ← compiled JS
      #     node_modules/ ← production deps
      #     package.json
      - name: Assemble deployment package
        run: |
          mkdir -p deploy
          # React build
          cp -r dist deploy/dist
          # Server compiled output + production deps
          mkdir -p deploy/server
          cp -r server/dist deploy/server/dist
          cp server/package.json deploy/server/package.json
          cp server/package-lock.json deploy/server/package-lock.json
          # Install server production dependencies into deploy/server/node_modules
          cd deploy/server && npm ci --omit=dev

      # ── Deploy ─────────────────────────────────────────────────────────────
      # Retry up to 3 times with a 30-second delay between attempts to handle
      # transient Azure OneDeploy 409 Conflict errors (e.g. App Service
      # internal lock contention from a concurrent slot-swap or restart).
      - name: Deploy to App Service (attempt 1)
        id: deploy_attempt_1
        if: env.HAS_PUBLISH_PROFILE == 'true' && env.HAS_APP_SERVICE_NAME == 'true'
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: ./deploy

      - name: Wait before retry (attempt 2)
        if: >
          env.HAS_PUBLISH_PROFILE == 'true' &&
          env.HAS_APP_SERVICE_NAME == 'true' &&
          steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to App Service (attempt 2)
        id: deploy_attempt_2
        if: >
          env.HAS_PUBLISH_PROFILE == 'true' &&
          env.HAS_APP_SERVICE_NAME == 'true' &&
          steps.deploy_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: ./deploy

      - name: Wait before retry (attempt 3)
        if: >
          env.HAS_PUBLISH_PROFILE == 'true' &&
          env.HAS_APP_SERVICE_NAME == 'true' &&
          steps.deploy_attempt_2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to App Service (attempt 3)
        id: deploy_attempt_3
        if: >
          env.HAS_PUBLISH_PROFILE == 'true' &&
          env.HAS_APP_SERVICE_NAME == 'true' &&
          steps.deploy_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: ./deploy

      - name: Fail after all deployment attempts exhausted
        if: >
          env.HAS_PUBLISH_PROFILE == 'true' &&
          env.HAS_APP_SERVICE_NAME == 'true' &&
          steps.deploy_attempt_1.outcome == 'failure' &&
          steps.deploy_attempt_2.outcome == 'failure' &&
          steps.deploy_attempt_3.outcome == 'failure'
        run: |
          echo "::error::All 3 deployment attempts failed. The App Service may be unavailable or locked."
          echo "  Attempt 1: ${{ steps.deploy_attempt_1.outcome }}"
          echo "  Attempt 2: ${{ steps.deploy_attempt_2.outcome }}"
          echo "  Attempt 3: ${{ steps.deploy_attempt_3.outcome }}"
          exit 1

      - name: Fail if deployment config is missing
        if: env.HAS_PUBLISH_PROFILE != 'true' || env.HAS_APP_SERVICE_NAME != 'true'
        run: |
          echo "::error::Deployment configuration is incomplete. The following must be set in the 'copilot' GitHub environment:"
          echo "  - Secret:   AZURE_APP_SERVICE_PUBLISH_PROFILE"
          echo "  - Variable: AZURE_APP_SERVICE_NAME"
          echo "See infra/README.md for setup instructions."
          exit 1
