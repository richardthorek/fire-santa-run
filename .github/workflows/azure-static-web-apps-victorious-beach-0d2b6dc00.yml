name: CI/CD Pipeline

# Legacy workflow retained for branch protection rule compatibility.
# Quality checks and deployment now occur in .github/workflows/deploy-app-service.yml.
# This file no longer runs redundant quality checks — it only creates a bug issue if the
# main deploy workflow fails on pushes to main (see create_bug_issue_on_failure job below).

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Deploy to Azure App Service"]
    types:
      - completed

jobs:
  # Minimal passthrough job kept so that any branch protection rule requiring
  # "Quality Checks (Lint, Test, Coverage)" from this workflow continues to pass.
  quality_checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Quality Checks (Lint, Test, Coverage)
    permissions:
      contents: read
    steps:
      - name: Branch protection passthrough — quality checks run in deploy-app-service workflow
        run: echo "Quality checks (lint, test, coverage) are run by the 'Deploy to Azure App Service' workflow. This job exists only to satisfy branch protection rules that reference this workflow."

  create_bug_issue_on_failure:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    name: Create Bug Issue on Failure
    permissions:
      issues: write
      actions: read
    steps:
      - name: Create Bug Issue
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const runId = run.id;
            const repo = context.repo;
            const sha = run.head_sha;
            const workflow = run.name;
            const runUrl = run.html_url;

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: repo.owner,
              repo: repo.repo,
              run_id: runId
            });

            const failedJobs = jobs.data.jobs.filter(job => job.conclusion === 'failure');

            let issueBody = `## Workflow Failure Report\n\n`;
            issueBody += `**Workflow:** ${workflow}\n`;
            issueBody += `**Run:** [#${run.run_number}](${runUrl})\n`;
            issueBody += `**Commit:** [${sha.substring(0, 7)}](https://github.com/${repo.owner}/${repo.repo}/commit/${sha})\n`;
            issueBody += `**Branch:** ${run.head_branch}\n`;
            issueBody += `**Triggered by:** @${run.triggering_actor.login}\n`;
            issueBody += `**Event:** ${run.event}\n\n`;

            issueBody += `### Failed Jobs\n\n`;
            for (const job of failedJobs) {
              issueBody += `- ${job.name} (${job.html_url})\n`;
            }

            issueBody += `\n### Logs\n\n`;
            issueBody += `[View full workflow logs](${runUrl})\n\n`;
            issueBody += `---\n`;
            issueBody += `This issue was automatically created by the workflow failure detection system.`;

            await github.rest.issues.create({
              owner: repo.owner,
              repo: repo.repo,
              title: `Workflow Failed: ${workflow} - Run #${run.run_number}`,
              body: issueBody,
              labels: ['bug']
            });

